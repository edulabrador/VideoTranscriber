packages:
  - "apps/*"
allowBuilds:
  esbuild: true

overrides:
  baseline-browser-mapping: ">=2.11.0"
  browserslist: ">=4.28.7"
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@5: ">=5.0.12 <6"
  js-yaml@4: ">=4.3.2 <5"
  # GHSA-g3hv-75wg-m249 is only fixed in 11.0.1, with no 3.x or 10.x backport. ESLint 9
  # and typescript-eslint ask for 3.x and 10.x but only use the Minimatch class and the
  # minimatch() function through require(), which work the same in 11. The ESM builds of
  # @eslint/config-array 0.21 and @eslint/eslintrc use a default import that 11 lacks, so
  # do not `import` them directly (for example FlatCompat). Drop this once ESLint itself
  # depends on minimatch 11.
  minimatch: ">=11.0.1 <12"
  nanoid@3: ">=3.3.18 <4"
  postcss-selector-parser: ">=7.1.6 <8"
  postcss: ">=8.5.23 <9"
  source-map-js: ">=1.2.2 <2"
