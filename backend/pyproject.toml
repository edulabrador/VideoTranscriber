[project]
name = "video-transcriber"
version = "0.1.0"
description = "Local-first YouTube, Instagram, TikTok, and X video transcriber"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "faster-whisper>=1.0.3",
  "yt-dlp[default]>=2026.08.19",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.9",
  "pyperclip>=1.9",
  "typer>=0.13",
  # faster-whisper's VAD uses onnxruntime; pinned below 1.24 because newer
  # onnxruntime releases dropped macOS x86_64 (Intel) wheels entirely.
  "onnxruntime<1.24",
  # Speaker diarization with ONNX models: no PyTorch and no Hugging Face token needed.
  # sherpa-onnx loads its native runtime from sherpa-onnx-core, which uv does not pick
  # up from the wheel metadata, so both are pinned to the same release.
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "nvidia-cublas-cu12==12.9.2.10",
  "nvidia-cudnn-cu12==9.22.0.52",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
transcriber = "backend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
# Keep transitive cache-lock and legacy wheel tooling above their security fixes.
constraint-dependencies = ["filelock>=4.2.1", "setuptools>=84.1.0"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
